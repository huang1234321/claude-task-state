name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache both the root workspace and the standalone src-tauri crate.
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Build core crates + forwarder
        run: cargo build --release -p cc_state -p cc_collector -p cc_forwarder

      - name: Core tests
        run: cargo test --workspace -- --test-threads=1

      - name: Install Tauri CLI (v2)
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate app icons
        run: cargo tauri icon app-icon.png

      # src-tauri is excluded from the root workspace (Tauri manages its own build).
      # bundle.targets in tauri.conf.json is ["msi","nsis"], so this emits both installers.
      - name: Build Tauri installers (msi + nsis)
        run: cargo tauri build

      - name: Installer unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: claude-task-state-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Keep the raw exe too, for quick smoke-testing without installing.
      - name: Upload exe (smoke artifact)
        uses: actions/upload-artifact@v4
        with:
          name: claude-task-state-exe
          path: src-tauri/target/release/claude-task-state.exe
          if-no-files-found: warn
